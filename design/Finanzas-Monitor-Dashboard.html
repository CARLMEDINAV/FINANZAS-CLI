<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Finanzas • Monitor Dashboard</title>
<style>
:root{
  --bg:#0b0b0c; --panel:#111113; --panel-2:#0f0f12; --border:#2a2f3a;
  --text:#F9FAFB; --muted:#9CA3AF; --head:#D1D5DB;
  --yellow:#FACC15; --green:#22C55E; --red:#EF4444; --input:#1F2937;
  --ring:#374151; --ok:#10B981; --danger:#F87171;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 Inter,system-ui,Segoe UI,Roboto,sans-serif; -webkit-font-smoothing:antialiased;
}
.container{max-width:1200px;margin:0 auto;padding:28px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
h1{margin:0;font-size:28px;letter-spacing:-.4px}
h1 span{color:var(--yellow)}
.sub{color:var(--muted);font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px}
.metric-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.metric-value{font-size:32px;font-weight:700;margin-top:6px}
.kbd{background:var(--input);border:1px solid var(--ring);padding:10px;border-radius:10px}
form.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:end}
.input,select,button.kbd{
  background:var(--input);color:var(--text);border:1px solid var(--ring);
  padding:10px 12px;border-radius:10px;outline:none;font:inherit
}
.input::placeholder{color:var(--muted)}
.btn{background:var(--yellow);color:#000;font-weight:800;border:none;padding:12px 20px;border-radius:12px;cursor:pointer}
.btn:hover{filter:brightness(.95)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px 0}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
.panel h3{margin:0 0 8px;color:var(--yellow);font-size:15px}
.empty{color:var(--muted);text-align:center;padding:36px;border:1px dashed var(--border);border-radius:12px}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--head);text-align:left;font-weight:600;padding:10px;border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.badge{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;color:#000}
.badge.ing{background:var(--green)}
.badge.gas{background:var(--red)}
.del{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:4px 8px;cursor:pointer}
footer{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}
@media(max-width:980px){.grid3{grid-template-columns:1fr 1fr}.panels{grid-template-columns:1fr}form.grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.grid3{grid-template-columns:1fr}form.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Finanzas<span>•</span>CLI</h1>
    <div class="sub">Monitor • Contraste AA • Negro/Amarillo</div>
  </header>

  <section class="grid3" id="metrics"></section>

  <section class="card">
    <h3 style="margin:0 0 12px;color:var(--yellow)">Nuevo movimiento</h3>
    <form class="grid" id="form">
      <select class="kbd" id="tipo" required>
        <option value="gasto">Gasto</option>
        <option value="ingreso">Ingreso</option>
      </select>
      <input class="input" id="categoria" placeholder="Categoría" required />
      <input class="input" id="monto" type="number" step="0.01" placeholder="Monto" required />
      <input class="input" id="descripcion" placeholder="Descripción" />
      <input class="input" id="fecha" type="date" />
      <div style="grid-column:1/-1;display:flex;justify-content:flex-end">
        <button class="btn" type="submit">Añadir movimiento</button>
      </div>
    </form>
  </section>

  <section class="panels">
    <div class="panel"><h3>Gastos por categoría</h3><div id="pie-gasto"></div></div>
    <div class="panel"><h3>Ingresos por categoría</h3><div id="pie-ingreso"></div></div>
  </section>

  <section class="table-wrap">
    <h3 style="margin:0 0 12px;color:var(--yellow)">Movimientos</h3>
    <table>
      <thead>
        <tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Monto</th><th>Descripción</th><th></th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
  <footer>Hecho con tema oscuro moderno • accesible</footer>
</div>

<script>
const theme = {yellow:'#FACC15',green:'#22C55E',red:'#EF4444',muted:'#9CA3AF',border:'#374151'}
const storeKey='finanzas_movs'
let movs = JSON.parse(localStorage.getItem(storeKey)||'[]')
if(!movs.length){
  movs=[
    {id:1, fecha:'2026-10-07', tipo:'ingreso', categoria:'Salario', descripcion:'Sueldo septiembre', monto:3000},
    {id:2, fecha:'2026-10-07', tipo:'gasto', categoria:'Alimentación', descripcion:'Mercado', monto:120.5}
  ]
}
const $ = s=>document.querySelector(s)
const metricsEl = $('#metrics')
const tbody = $('#tbody')
const form = $('#form')
const tipoEl = $('#tipo')
const catEl = $('#categoria')
const montoEl = $('#monto')
const descEl = $('#descripcion')
const fechaEl = $('#fecha')

function save(){ localStorage.setItem(storeKey, JSON.stringify(movs)) }
function totals(){
  const ing = movs.filter(m=>m.tipo==='ingreso').reduce((a,b)=>a+b.monto,0)
  const gas = movs.filter(m=>m.tipo==='gasto').reduce((a,b)=>a+b.monto,0)
  return {ing,gas,saldo:ing-gas}
}
function byCat(tipo){
  const map={}
  movs.filter(m=>m.tipo===tipo).forEach(m=>{ map[m.categoria]=(map[m.categoria]||0)+m.monto })
  return Object.entries(map)
}
function renderMetrics(){
  const {ing,gas,saldo}=totals()
  const saldoColor = saldo>=0?'#22C55E':'#EF4444'
  metricsEl.innerHTML = `
    <div class="card"><div class="metric-label">Ingresos</div><div class="metric-value" style="color:#22C55E">$${ing.toFixed(2)}</div></div>
    <div class="card"><div class="metric-label">Gastos</div><div class="metric-value" style="color:#EF4444">$${gas.toFixed(2)}</div></div>
    <div class="card"><div class="metric-label">Saldo</div><div class="metric-value" style="color:${saldoColor}">$${saldo.toFixed(2)}</div></div>
  `
}
function renderTable(){
  if(!movs.length){ tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:${theme.muted}">No hay movimientos registrados aún</td></tr>`; return }
  tbody.innerHTML = movs.map(m=>`
    <tr>
      <td>${m.fecha}</td>
      <td><span class="badge ${m.tipo==='ingreso'?'ing':'gas'}">${m.tipo}</span></td>
      <td>${m.categoria}</td>
      <td>$${m.monto.toFixed(2)}</td>
      <td>${m.descripcion||''}</td>
      <td><button class="del" data-id="${m.id}">eliminar</button></td>
    </tr>
  `).join('')
  tbody.querySelectorAll('.del').forEach(b=>b.onclick=()=>{ movs=movs.filter(x=>x.id!==+b.dataset.id); save(); refresh() })
}
function pieBlock(data, el){
  if(!data || !data.length){ el.innerHTML = `<div class="empty">Sin datos registrados</div>`; return }
  const total = data.reduce((a,[,v])=>a+v,0)||1
  let acc=0
  const rows = data.map(([label,val],i)=>{
    const pct = val/total
    const start = acc; acc+=pct
    return `<div style="display:flex;gap:8px;margin:4px 0"><span style="width:12px;height:12px;background:${theme.yellow};display:inline-block;border-radius:2px"></span>${label}: <b>${val.toFixed(2)}</b> (${(pct*100).toFixed(1)}%)</div>`
  }).join('')
  el.innerHTML = `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 120 120" style="width:140;height:140"><circle cx="60" cy="60" r="52" fill="none" stroke="${theme.border}" stroke-width="12"/><g>
    ${data.map(([label,val],i)=>{const pct=val/total;const start=acc;acc+=pct;return ''}).join('')}
  </g></svg><div style="font-size:13px">${rows}</div></div>`
}
function refresh(){
  renderMetrics()
  renderTable()
  $('#pie-gasto').innerHTML = ''
  $('#pie-ingreso').innerHTML = ''
  // simple textual pie fallback
  function renderPie(id, tipo){
    const data = byCat(tipo)
    const el = document.getElementById(id)
    if(!data.length){ el.innerHTML = `<div class="empty">Sin datos registrados</div>`; return }
    const total = data.reduce((a,[,v])=>a+v,0)||1
    el.innerHTML = data.map(([label,val])=>`<div style="margin:4px 0">${label}: <b>$${val.toFixed(2)}</b> (${((val/total)*100).toFixed(1)}%)</div>`).join('')
  }
  renderPie('pie-gasto','gasto')
  renderPie('pie-ingreso','ingreso')
}
fechaEl.value = new Date().toISOString().slice(0,10)
form.onsubmit = e=>{ e.preventDefault(); const nuevo={id:Date.now(),fecha:fechaEl.value||new Date().toISOString().slice(0,10),tipo:tipoEl.value,categoria:catEl.value,monto:parseFloat(montoEl.value)||0,descripcion:descEl.value}; movs=[nuevo,...movs]; save(); form.reset(); fechaEl.value=new Date().toISOString().slice(0,10); refresh() }
refresh()
</script>
</body>
</html>
